<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Texas Ranchers Shop</title>
<link rel="stylesheet" href="assets/fonts/solano.css">
<link rel="stylesheet" href="https://use.typekit.net/gzo2cgx.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#002a3a;--ink:#e7e4dd;--mute:#7ca7ad;--red:#e02826;--on-red:#ffffff;
  --f-head:"Solano Gothic MVB","solano-gothic-pro-mvb","Barlow Condensed","Arial Narrow",sans-serif;
  --f-label:"sweet-square-pro","Archivo",sans-serif;
  --f-body:"sweet-sans-pro","Archivo",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
/* flat True Navy with the navy limestone texture at a whisper (opacity baked into the file) */
body{background:var(--bg) url(assets/navy-limestone.webp) center/cover no-repeat}
body{color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}

/* artboard (fixed, so the 1500px board never widens a phone's layout viewport) */
#art{position:fixed;left:0;top:0;width:1500px;height:1000px;transform-origin:0 0;
}

/* shared text styles */
.ui{font-family:var(--f-label);font-size:12px;font-weight:800;font-stretch:125%;letter-spacing:.12em;text-transform:uppercase}
.pill{height:34px;padding:0 20px;border:1px solid rgba(231,228,221,.6);border-radius:0;display:inline-grid;place-items:center;transition:background .25s,color .25s}
.pill:hover{background:var(--ink);color:var(--bg)}

/* header */
#about{position:absolute;left:46px;top:46px}
#logo{position:absolute;left:50%;top:26px;transform:translateX(-50%);display:block;width:180px;height:60px}
#contact{position:absolute;right:46px;top:46px}

/* rail */
#rail{position:absolute;left:150px;right:150px;top:254px;height:12px;border-radius:6px;
  background:linear-gradient(#fafafa 0%,#b9bcc1 28%,#5d6066 55%,#a9adb3 78%,#e6e7e9 100%);
  box-shadow:0 10px 18px rgba(0,0,0,.45)}
#rail::before,#rail::after{content:"";position:absolute;top:-9px;width:16px;height:30px;border-radius:5px;
  background:linear-gradient(90deg,#8d9096,#f3f3f4 45%,#7a7d83)}
#rail::before{left:-14px}
#rail::after{right:-14px}

/* rack + garments */
#rack{position:absolute;left:0;top:0;width:1500px;height:1000px}
.g{position:absolute;top:236px;width:289px;height:300px;margin-left:-144.5px;perspective:900px;cursor:pointer;
  transition:left .75s cubic-bezier(.2,.8,.2,1)}
.g i{position:absolute;inset:0;background-repeat:no-repeat;transform-origin:50% 4%;transform:rotateY(-74deg);
  filter:brightness(.82) drop-shadow(0 18px 18px rgba(0,0,0,.5));
  transition:transform .75s cubic-bezier(.2,.8,.2,1),filter .75s}
.g.face i{transform:rotateY(0deg);filter:brightness(1) drop-shadow(0 22px 26px rgba(0,0,0,.55))}

/* caption (hidden unless .on; written with :not so the open-state .dimmer rule can still hide it) */
#cap{position:absolute;top:552px;transform:translateX(-50%);text-align:center;font-family:var(--f-label);font-size:11px;font-weight:800;font-stretch:125%;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);white-space:nowrap;pointer-events:none;
  transition:left .75s cubic-bezier(.2,.8,.2,1),opacity .35s}
#cap:not(.on){opacity:0}
#cap b{display:block;color:var(--ink);font-weight:800;margin-bottom:4px}

/* pill */
#avail{position:absolute;left:50%;top:790px;transform:translateX(-50%)}

/* marquee band */
#band{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--red);color:var(--on-red);overflow:hidden;display:flex;align-items:center}
#track{display:flex;flex:none;white-space:nowrap;font-family:var(--f-label);font-size:13px;font-weight:800;font-stretch:125%;letter-spacing:.14em;animation:mq 22s linear infinite}
#track span{padding-right:22px}
@keyframes mq{to{transform:translateX(-50%)}}

/* detail layer */
#det{position:absolute;inset:0;pointer-events:none}
.hit{position:absolute;inset:0}
#big2,#big{position:absolute;left:50%;top:244px;width:473px;height:492px;margin-left:-236.5px;background-repeat:no-repeat;opacity:0}
#big2{pointer-events:none}
#big{transform-origin:50% 4%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.arr{position:absolute;top:452px;width:46px;height:46px;border-radius:0;border:1px solid rgba(231,228,221,.5);
  display:grid;place-items:center;opacity:0;transition:opacity .4s .25s,background .2s,color .2s}
.arr:hover{background:var(--ink);color:var(--bg)}
#prev{left:calc(50% - 300px)}
#next{left:calc(50% + 254px)}
#info{position:absolute;left:50%;top:770px;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .5s .25s}
#num{font-family:var(--f-label);font-size:11px;font-weight:800;font-stretch:125%;letter-spacing:.16em;color:var(--mute)}
#name{font-family:var(--f-head);font-weight:700;font-size:40px;line-height:.92;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);margin:12.6px 0 10.6px;white-space:nowrap}
#price{font-family:var(--f-label);font-size:13px;font-weight:800;font-stretch:125%;letter-spacing:.08em;color:var(--mute);margin-bottom:18px}
#info::before{content:"";position:absolute;left:50%;top:-18px;width:48px;height:3px;margin-left:-24px;background:var(--red)}
#close{position:absolute;right:46px;top:46px;opacity:0;transition:opacity .4s .25s}
body.open #det{pointer-events:auto}
body.open #det button,body.open #det a{pointer-events:auto}
body.open #info,body.open .arr,body.open #close{opacity:1}

/* open wash-out */
.dim{transition:opacity .7s cubic-bezier(.2,.8,.2,1),filter .7s}
.pill.dim{transition:background .25s,color .25s,opacity .7s cubic-bezier(.2,.8,.2,1),filter .7s}
body.open .dim{opacity:.12;filter:blur(2px)}
body.open .dimmer{opacity:0;pointer-events:none}

/* reduced motion: no marquee scroll, no garment slide/swing; fades stay */
@media (prefers-reduced-motion:reduce){
  #track{animation:none}
  .g,.g i{transition:none}
  #cap{transition:opacity .35s}
}
</style>
</head>
<body>
<div id="art">
  <div id="about" class="ui dim">About</div>
  <img id="logo" class="dim" src="assets/wordmark-full-bone.webp" width="180" height="60" alt="Texas Ranchers" draggable="false">
  <div id="contact" class="ui dim dimmer">Contact</div>
  <div id="rail" class="dim"></div>
  <div id="rack" class="dim"></div>
  <div id="cap" class="dimmer"><b></b><span></span></div>
  <a id="avail" class="pill ui dim dimmer" href="https://shop.ranchers.com/collections/all-products" target="_blank" rel="noopener">Shop all</a>
  <div id="band" class="dimmer" aria-hidden="true"><div id="track"></div></div>
  <div id="det">
    <div class="hit"></div>
    <div id="big2"></div>
    <div id="big"></div>
    <button id="prev" class="arr" aria-label="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5L8 12L15 19"/></svg></button>
    <button id="next" class="arr" aria-label="Next"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5L16 12L9 19"/></svg></button>
    <div id="info">
      <div id="num"></div>
      <div id="name"></div>
      <div id="price"></div>
      <a id="shop" class="pill ui" href="https://shop.ranchers.com/collections/all-products" target="_blank" rel="noopener">Shop this piece</a>
    </div>
    <button id="close" class="ui">Close</button>
  </div>
</div>

  ];
  var N = 10, SLOT = 108, OPEN = 86, CX = 750, EASE = 'cubic-bezier(.2,.8,.2,1)';
  var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var T_OPEN = RM ? 0 : 750, T_STEP = RM ? 0 : 600, T_CLOSE = RM ? 0 : 650;
  var hov = -1, open = -1;
  var $ = function (id) { return document.getElementById(id); };
  var art = $('art'), rack = $('rack'), cap = $('cap'), capName = cap.querySelector('b'), capPrice = cap.querySelector('span');
  var big = $('big'), big2 = $('big2'), num = $('num'), nameEl = $('name'), priceEl = $('price'), shop = $('shop');

  // the detail name font is first used on open; fetch it now so the first open doesn't swap fonts
  if (document.fonts && document.fonts.load) { document.fonts.load('700 40px "Solano Gothic MVB"'); }

  // 1500x1000 artboard, scaled to fit and centred
  function fit() {
    var k = Math.min(window.innerWidth / 1500, window.innerHeight / 1000);
    art.style.transform = 'scale(' + k + ')';
    art.style.left = (window.innerWidth - 1500 * k) / 2 + 'px';
    art.style.top = (window.innerHeight - 1000 * k) / 2 + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  // marquee: 6 spans x 16
  var track = $('track'), words = ['TEXAS RANCHERS', '•', 'OFFICIAL MERCH', '•', '#RIDETALL', '•'];
  for (var r = 0; r < 16; r++) for (var w = 0; w < words.length; w++) {
    var s = document.createElement('span'); s.textContent = words[w]; track.appendChild(s);
  }

  // paint garment k so its padded crop box fills el (px maths from the layout size)
  function paint(el, k) {
    var ew = el.offsetWidth, eh = el.offsetHeight, sx = ew / BW, sy = eh / CH;
    var xb = (k % 5) * CW - PAD, yb = ROWY[Math.floor(k / 5)];
    el.style.backgroundImage = 'url("' + SHEET + '")';
    el.style.backgroundSize = (SW * sx) + 'px ' + (SH * sy) + 'px';
    el.style.backgroundPosition = (-xb * sx) + 'px ' + (-yb * sy) + 'px';
    el.style.clipPath = POLY[k];
  }

  var G = [];
  function layout() {
    for (var k = 0; k < N; k++) {
      var x = CX + (k - (N - 1) / 2) * SLOT;
      if (hov >= 0 && k !== hov) x += Math.sign(k - hov) * OPEN;
      G[k].style.left = x + 'px';
      G[k].classList.toggle('face', k === hov);
    }
    if (hov >= 0) {
      cap.style.left = G[hov].style.left;
      capName.textContent = P[hov][0];
      capPrice.textContent = P[hov][1];
      cap.classList.add('on');
    } else {
      cap.classList.remove('on');
    }
  }

  for (var k = 0; k < N; k++) (function (k) {
    var g = document.createElement('div'); g.className = 'g';
    var i = document.createElement('i'); g.appendChild(i);
    rack.appendChild(g);
    paint(i, k);
    g.addEventListener('pointerenter', function () { if (open < 0) { hov = k; layout(); } });
    g.addEventListener('click', function () { openG(k); });
    G.push(g);
  })(k);
  rack.addEventListener('pointerleave', function () { if (open < 0) { hov = -1; layout(); } });

  function two(n) { return (n < 10 ? '0' : '') + n; }
  function fill(k) {
    num.textContent = two(k + 1) + ' / ' + two(N);
    nameEl.textContent = P[k][0];
    priceEl.textContent = P[k][1];
    shop.href = P[k][2];
  }
  function cancel(el) { el.getAnimations().forEach(function (a) { a.cancel(); }); }

  function openG(k) {
    if (open >= 0) return;
    open = k; hov = k; layout();
    var gx = parseFloat(G[k].style.left);
    cancel(big);
    paint(big, k);
    fill(k);
    document.body.classList.add('open');
    big.animate([
      { transform: 'translate(' + (gx - 750) + 'px,-8px) scale(.61)', opacity: 1 },
      { transform: 'none', opacity: 1 }
    ], { duration: T_OPEN, easing: EASE, fill: 'forwards' });
    G[k].style.visibility = 'hidden';
  }

  function step(d) {
    if (open < 0) return;
    var from = open;
    open = (open + d + N) % N;
    fill(open);
    G[from].style.visibility = '';
    G[open].style.visibility = 'hidden';
    hov = open; layout();
    paint(big2, from);
    big2.animate([
      { transform: 'none', opacity: 1, filter: 'blur(0)' },
      { transform: 'translateX(' + (-d * 120) + 'px) scale(.94)', opacity: 0, filter: 'blur(6px)' }
    ], { duration: T_STEP, easing: EASE });
    cancel(big);
    paint(big, open);
    big.animate([
      { transform: 'translateX(' + (d * 120) + 'px) scale(.94)', opacity: 0, filter: 'blur(6px)' },
      { transform: 'none', opacity: 1, filter: 'blur(0)' }
    ], { duration: T_STEP, easing: EASE, fill: 'forwards' });
  }

  function closeG() {
    if (open < 0) return;
    var k = open, gx = parseFloat(G[k].style.left);
    big.animate([
      { transform: 'none', opacity: 1 },
      { transform: 'translate(' + (gx - 750) + 'px,-8px) scale(.61)', opacity: 1 }
    ], { duration: T_CLOSE, easing: EASE, fill: 'forwards' });
    document.body.classList.remove('open');
    setTimeout(function () {
      G[k].style.visibility = '';
      cancel(big);
      big.style.opacity = 0;
      open = -1; hov = -1; layout();
    }, T_CLOSE);
  }

  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  $('close').addEventListener('click', closeG);
  document.querySelector('#det .hit').addEventListener('click', closeG);

  window.addEventListener('keydown', function (e) {
    if (open < 0) {
      if (e.key === 'ArrowRight') { hov = Math.min(N - 1, hov + 1); layout(); }
      else if (e.key === 'ArrowLeft') { hov = hov < 0 ? N - 1 : Math.max(0, hov - 1); layout(); }

      else if (e.key === 'Enter') { if (hov >= 0 && !(e.target.closest && e.target.closest('a,button'))) openG(hov); }

      if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'Escape') closeG();
    }
  });

  layout();
  window.__closet = { openG: openG, step: step, closeG: closeG, setHov: function (k) { hov = k; layout(); } };
})();
